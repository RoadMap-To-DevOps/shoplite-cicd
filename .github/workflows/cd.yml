name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_sha:
        description: "Commit SHA to deploy (leave empty to deploy the selected branch)"
        required: false
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout requested release
        if: ${{ inputs.release_sha != '' }}
        run: |
          git checkout --detach "${{ inputs.release_sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run lint
        working-directory: app
        run: npm run lint

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Set release SHA
        id: release
        run: |
          if [ -n "${{ inputs.release_sha }}" ]; then
            echo "sha=${{ inputs.release_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Write version
        working-directory: app
        run: echo "${{ steps.release.outputs.sha }}" > VERSION

      - name: Create release package
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          mkdir -p artifact

          tar \
            --exclude='app/node_modules' \
            --exclude='app/tests' \
            --exclude='app/test' \
            -czf "artifact/webapp-${RELEASE_SHA}.tar.gz" \
            app \
            deploy \
            scripts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-${{ steps.release.outputs.sha }}
          path: artifact/webapp-${{ steps.release.outputs.sha }}.tar.gz

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production
      url: http://${{ vars.BASTION_HOST }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-${{ needs.build.outputs.release_sha }}
          path: artifact

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > deploy-key.pem
          chmod 600 deploy-key.pem

      - name: Copy release to app server
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          APP_HOST: ${{ vars.APP_HOSTS }}
          SSH_USER: ${{ vars.SSH_USER }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          scp \
            -i deploy-key.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i deploy-key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ${SSH_USER}@${BASTION_HOST}" \
            "artifact/webapp-${RELEASE_SHA}.tar.gz" \
            "${SSH_USER}@${APP_HOST}:/tmp/webapp-${RELEASE_SHA}.tar.gz"

      - name: Run deployment
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          APP_HOST: ${{ vars.APP_HOSTS }}
          SSH_USER: ${{ vars.SSH_USER }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          ssh \
            -i deploy-key.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i deploy-key.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ${SSH_USER}@${BASTION_HOST}" \
            "${SSH_USER}@${APP_HOST}" \
            "sudo bash -c 'tar -xzf /tmp/webapp-${RELEASE_SHA}.tar.gz -C /tmp && \
            chmod +x /tmp/scripts/deploy.sh && \
            /tmp/scripts/deploy.sh ${RELEASE_SHA}'"

      - name: Smoke test
        env:
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${BASTION_HOST}/version" | grep -q "${RELEASE_SHA}"; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 3
          done

          echo "Smoke test failed."
          exit 1
